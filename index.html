<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebView</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #website {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-family: Arial, sans-serif;
            z-index: 10;
        }

        #error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: white;
            text-align: center;
            z-index: 20;
        }

        #error h1 {
            font-size: 60px;
            margin: 0;
        }

        #error p {
            color: #666;
        }
    </style>
</head>

<body>

<div id="loading">
    Memuat website...
</div>

<div id="error">
    <h1>403</h1>
    <p>Website tidak dapat ditampilkan.</p>
</div>

<iframe
    id="website"
    style="display:none;"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups">
</iframe>

<script>

const SUPABASE_URL =
    "https://zadfmipevufwxbzhqqxz.supabase.co";

const FUNCTION_NAME =
    "smooth-handler";


async function loadWebsite() {
  
    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    if (!id) {

        showError();

        return;
    }


    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}?id=${encodeURIComponent(id)}`
            );


        if (!response.ok) {

            showError();

            return;
        }


        const html =
            await response.text();


        const iframe =
            document.getElementById("website");


        iframe.srcdoc = html;


        iframe.style.display =
            "block";


        document.getElementById(
            "loading"
        ).style.display = "none";


    } catch (error) {

        console.error(error);

        showError();

    }

}


function showError() {

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "website"
    ).style.display = "none";


    document.getElementById(
        "error"
    ).style.display = "flex";

}


loadWebsite();

</script>

</body>
</html>
